<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 950" width="100%" height="100%" style="background:#0f172a; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="entityGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6">
      <circle cx="5" cy="5" r="3" fill="#38bdf8"/>
    </marker>
  </defs>

  <!-- Title & Metadata -->
  <text x="50" y="45" fill="#f8fafc" font-size="24" font-weight="bold">WhatsApp Relational Messaging Schema (BCNF)</text>
  <text x="50" y="70" fill="#94a3b8" font-size="14">DBMS Project 2026 · Team T0084 · Entity-Relationship Diagram · Schema: whatsapp</text>

  <!-- CONNECTING LINES (Lines behind cards) -->
  <!-- Users -> Devices -->
  <path d="M 180 340 L 180 430" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  <!-- Users -> Chats (created_by) -->
  <path d="M 310 180 L 490 180" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  <!-- Chats -> Chat_Members -->
  <path d="M 600 320 L 600 430" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  <!-- Users -> Chat_Members -->
  <path d="M 280 340 L 280 490 L 490 490" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  <!-- Chats -> Messages -->
  <path d="M 710 200 L 890 200" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  <!-- Users -> Messages (sender_id) -->
  <path d="M 310 130 L 990 130 L 990 150" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  <!-- Messages -> Media -->
  <path d="M 990 420 L 990 490 L 890 490 L 890 530" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  <!-- Users -> Media (uploader_id) -->
  <path d="M 100 340 L 100 700 L 710 700 L 710 650" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  <!-- Messages -> Message_Receipts -->
  <path d="M 1110 280 L 1190 280 L 1190 350" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  <!-- Users -> Message_Receipts -->
  <path d="M 200 100 L 200 90 L 1290 90 L 1290 350" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  <!-- Messages -> Messages (reply_to self) -->
  <path d="M 1110 220 C 1170 200, 1170 260, 1110 250" stroke="#38bdf8" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  <!-- Chats -> Calls -->
  <path d="M 520 320 L 520 740 L 460 740" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  <!-- Users -> Calls (caller_id) -->
  <path d="M 230 340 L 230 740 L 250 740" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  <!-- Users -> Blocked_Users (blocker & blocked) -->
  <path d="M 150 340 L 150 770" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)" />

  <!-- 1. USERS TABLE -->
  <g transform="translate(50, 100)" filter="url(#shadow)">
    <rect width="260" height="240" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <path d="M 0 0 h 260 v 36 h -260 z" fill="url(#headerGrad)" rx="8"/>
    <text x="15" y="24" fill="#ffffff" font-size="14" font-weight="bold">USERS</text>
    <text x="210" y="24" fill="#dbeafe" font-size="11">30,000 rows</text>
    <text x="15" y="60" fill="#38bdf8" font-size="12" font-weight="bold">PK  user_id</text><text x="180" y="60" fill="#94a3b8" font-size="12">BIGINT</text>
    <text x="15" y="82" fill="#fbbf24" font-size="12" font-weight="bold">UQ  phone_e164</text><text x="180" y="82" fill="#94a3b8" font-size="12">VARCHAR(20)</text>
    <text x="15" y="104" fill="#e2e8f0" font-size="12">    display_name</text><text x="180" y="104" fill="#94a3b8" font-size="12">VARCHAR(255)</text>
    <text x="15" y="126" fill="#e2e8f0" font-size="12">    about</text><text x="180" y="126" fill="#94a3b8" font-size="12">TEXT</text>
    <text x="15" y="148" fill="#e2e8f0" font-size="12">    is_business</text><text x="180" y="148" fill="#94a3b8" font-size="12">BOOLEAN</text>
    <text x="15" y="170" fill="#e2e8f0" font-size="12">    joined_on</text><text x="180" y="170" fill="#94a3b8" font-size="12">DATE</text>
    <text x="15" y="192" fill="#e2e8f0" font-size="12">    last_seen_at</text><text x="180" y="192" fill="#94a3b8" font-size="12">TIMESTAMPTZ</text>
    <text x="15" y="214" fill="#e2e8f0" font-size="12">    status</text><text x="180" y="214" fill="#94a3b8" font-size="12">VARCHAR(20)</text>
  </g>

  <!-- 2. DEVICES TABLE -->
  <g transform="translate(50, 430)" filter="url(#shadow)">
    <rect width="260" height="190" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <path d="M 0 0 h 260 v 34 h -260 z" fill="#334155" rx="8"/>
    <text x="15" y="22" fill="#ffffff" font-size="14" font-weight="bold">DEVICES</text>
    <text x="210" y="22" fill="#94a3b8" font-size="11">42,000</text>
    <text x="15" y="56" fill="#38bdf8" font-size="12" font-weight="bold">PK  device_id</text><text x="180" y="56" fill="#94a3b8" font-size="12">BIGINT</text>
    <text x="15" y="78" fill="#a78bfa" font-size="12">FK  user_id</text><text x="180" y="78" fill="#94a3b8" font-size="12">BIGINT</text>
    <text x="15" y="100" fill="#e2e8f0" font-size="12">    device_type</text><text x="180" y="100" fill="#94a3b8" font-size="12">VARCHAR(20)</text>
    <text x="15" y="122" fill="#e2e8f0" font-size="12">    app_version</text><text x="180" y="122" fill="#94a3b8" font-size="12">VARCHAR(30)</text>
    <text x="15" y="144" fill="#e2e8f0" font-size="12">    registered_at</text><text x="180" y="144" fill="#94a3b8" font-size="12">TIMESTAMPTZ</text>
    <text x="15" y="166" fill="#e2e8f0" font-size="12">    last_active_at</text><text x="180" y="166" fill="#94a3b8" font-size="12">TIMESTAMPTZ</text>
  </g>

  <!-- 3. CHATS TABLE -->
  <g transform="translate(490, 130)" filter="url(#shadow)">
    <rect width="220" height="190" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <path d="M 0 0 h 220 v 34 h -220 z" fill="url(#headerGrad)" rx="8"/>
    <text x="15" y="22" fill="#ffffff" font-size="14" font-weight="bold">CHATS</text>
    <text x="170" y="22" fill="#dbeafe" font-size="11">23,000</text>
    <text x="15" y="56" fill="#38bdf8" font-size="12" font-weight="bold">PK  chat_id</text><text x="150" y="56" fill="#94a3b8" font-size="12">BIGINT</text>
    <text x="15" y="78" fill="#e2e8f0" font-size="12">    chat_type</text><text x="150" y="78" fill="#94a3b8" font-size="12">VARCHAR(10)</text>
    <text x="15" y="100" fill="#e2e8f0" font-size="12">    group_name</text><text x="150" y="100" fill="#94a3b8" font-size="12">VARCHAR(255)</text>
    <text x="15" y="122" fill="#a78bfa" font-size="12">FK  created_by</text><text x="150" y="122" fill="#94a3b8" font-size="12">BIGINT</text>
    <text x="15" y="144" fill="#e2e8f0" font-size="12">    created_at</text><text x="150" y="144" fill="#94a3b8" font-size="12">TIMESTAMPTZ</text>
  </g>

  <!-- 4. CHAT_MEMBERS TABLE (BRIDGE) -->
  <g transform="translate(490, 430)" filter="url(#shadow)">
    <rect width="240" height="190" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <path d="M 0 0 h 240 v 34 h -240 z" fill="#b45309" rx="8"/>
    <text x="15" y="22" fill="#ffffff" font-size="14" font-weight="bold">CHAT_MEMBERS</text>
    <text x="180" y="22" fill="#fef3c7" font-size="11">104,514</text>
    <text x="15" y="56" fill="#f59e0b" font-size="12" font-weight="bold">PK,FK chat_id</text><text x="170" y="56" fill="#94a3b8" font-size="12">BIGINT</text>
    <text x="15" y="78" fill="#f59e0b" font-size="12" font-weight="bold">PK,FK user_id</text><text x="170" y="78" fill="#94a3b8" font-size="12">BIGINT</text>
    <text x="15" y="100" fill="#e2e8f0" font-size="12">      role</text><text x="170" y="100" fill="#94a3b8" font-size="12">VARCHAR(20)</text>
    <text x="15" y="122" fill="#e2e8f0" font-size="12">      joined_at</text><text x="170" y="122" fill="#94a3b8" font-size="12">TIMESTAMPTZ</text>
    <text x="15" y="144" fill="#e2e8f0" font-size="12">      left_at</text><text x="170" y="144" fill="#94a3b8" font-size="12">TIMESTAMPTZ</text>
    <text x="15" y="166" fill="#e2e8f0" font-size="12">      is_muted</text><text x="170" y="166" fill="#94a3b8" font-size="12">BOOLEAN</text>
  </g>

  <!-- 5. MESSAGES TABLE -->
  <g transform="translate(890, 150)" filter="url(#shadow)">
    <rect width="220" height="270" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <path d="M 0 0 h 220 v 34 h -220 z" fill="url(#headerGrad)" rx="8"/>
    <text x="15" y="22" fill="#ffffff" font-size="14" font-weight="bold">MESSAGES</text>
    <text x="160" y="22" fill="#dbeafe" font-size="11">120,000</text>
    <text x="15" y="56" fill="#38bdf8" font-size="12" font-weight="bold">PK  message_id</text><text x="150" y="56" fill="#94a3b8" font-size="12">BIGINT</text>
    <text x="15" y="78" fill="#a78bfa" font-size="12">FK  chat_id</text><text x="150" y="78" fill="#94a3b8" font-size="12">BIGINT</text>
    <text x="15" y="100" fill="#a78bfa" font-size="12">FK  sender_id</text><text x="150" y="100" fill="#94a3b8" font-size="12">BIGINT</text>
    <text x="15" y="122" fill="#e2e8f0" font-size="12">    sent_at</text><text x="150" y="122" fill="#94a3b8" font-size="12">TIMESTAMPTZ</text>
    <text x="15" y="144" fill="#e2e8f0" font-size="12">    message_type</text><text x="150" y="144" fill="#94a3b8" font-size="12">VARCHAR(20)</text>
    <text x="15" y="166" fill="#e2e8f0" font-size="12">    body</text><text x="150" y="166" fill="#94a3b8" font-size="12">TEXT</text>
    <text x="15" y="188" fill="#a78bfa" font-size="12">FK  media_id</text><text x="150" y="188" fill="#94a3b8" font-size="12">BIGINT</text>
    <text x="15" y="210" fill="#a78bfa" font-size="12">FK  reply_to_msg</text><text x="150" y="210" fill="#94a3b8" font-size="12">BIGINT</text>
    <text x="15" y="232" fill="#e2e8f0" font-size="12">    is_forwarded</text><text x="150" y="232" fill="#94a3b8" font-size="12">BOOLEAN</text>
    <text x="15" y="254" fill="#e2e8f0" font-size="12">    is_deleted</text><text x="150" y="254" fill="#94a3b8" font-size="12">BOOLEAN</text>
  </g>

  <!-- 6. MESSAGE_RECEIPTS (BRIDGE) -->
  <g transform="translate(1160, 350)" filter="url(#shadow)">
    <rect width="210" height="150" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <path d="M 0 0 h 210 v 34 h -210 z" fill="#b45309" rx="8"/>
    <text x="12" y="22" fill="#ffffff" font-size="13" font-weight="bold">MESSAGE_RECEIPTS</text>
    <text x="160" y="22" fill="#fef3c7" font-size="10">501,590</text>
    <text x="12" y="56" fill="#f59e0b" font-size="12" font-weight="bold">PK,FK msg_id</text><text x="140" y="56" fill="#94a3b8" font-size="12">BIGINT</text>
    <text x="12" y="78" fill="#f59e0b" font-size="12" font-weight="bold">PK,FK user_id</text><text x="140" y="78" fill="#94a3b8" font-size="12">BIGINT</text>
    <text x="12" y="100" fill="#e2e8f0" font-size="12">      delivered_at</text><text x="140" y="100" fill="#94a3b8" font-size="12">TIMESTAMPTZ</text>
    <text x="12" y="122" fill="#e2e8f0" font-size="12">      read_at</text><text x="140" y="122" fill="#94a3b8" font-size="12">TIMESTAMPTZ</text>
  </g>

  <!-- 7. MEDIA TABLE -->
  <g transform="translate(790, 530)" filter="url(#shadow)">
    <rect width="220" height="210" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <path d="M 0 0 h 220 v 34 h -220 z" fill="#334155" rx="8"/>
    <text x="15" y="22" fill="#ffffff" font-size="14" font-weight="bold">MEDIA</text>
    <text x="170" y="22" fill="#94a3b8" font-size="11">27,634</text>
    <text x="15" y="56" fill="#38bdf8" font-size="12" font-weight="bold">PK  media_id</text><text x="150" y="56" fill="#94a3b8" font-size="12">BIGINT</text>
    <text x="15" y="78" fill="#a78bfa" font-size="12">FK  uploader_id</text><text x="150" y="78" fill="#94a3b8" font-size="12">BIGINT</text>
    <text x="15" y="100" fill="#e2e8f0" font-size="12">    media_type</text><text x="150" y="100" fill="#94a3b8" font-size="12">VARCHAR(20)</text>
    <text x="15" y="122" fill="#e2e8f0" font-size="12">    mime_type</text><text x="150" y="122" fill="#94a3b8" font-size="12">VARCHAR(100)</text>
    <text x="15" y="144" fill="#e2e8f0" font-size="12">    size_bytes</text><text x="150" y="144" fill="#94a3b8" font-size="12">BIGINT</text>
    <text x="15" y="166" fill="#e2e8f0" font-size="12">    sha256</text><text x="150" y="166" fill="#94a3b8" font-size="12">CHAR(64)</text>
    <text x="15" y="188" fill="#e2e8f0" font-size="12">    uploaded_at</text><text x="150" y="188" fill="#94a3b8" font-size="12">TIMESTAMPTZ</text>
  </g>

  <!-- 8. CALLS TABLE -->
  <g transform="translate(250, 680)" filter="url(#shadow)">
    <rect width="210" height="230" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <path d="M 0 0 h 210 v 34 h -210 z" fill="#334155" rx="8"/>
    <text x="15" y="22" fill="#ffffff" font-size="14" font-weight="bold">CALLS</text>
    <text x="160" y="22" fill="#94a3b8" font-size="11">25,000</text>
    <text x="15" y="56" fill="#38bdf8" font-size="12" font-weight="bold">PK  call_id</text><text x="140" y="56" fill="#94a3b8" font-size="12">BIGINT</text>
    <text x="15" y="78" fill="#a78bfa" font-size="12">FK  chat_id</text><text x="140" y="78" fill="#94a3b8" font-size="12">BIGINT</text>
    <text x="15" y="100" fill="#a78bfa" font-size="12">FK  caller_id</text><text x="140" y="100" fill="#94a3b8" font-size="12">BIGINT</text>
    <text x="15" y="122" fill="#e2e8f0" font-size="12">    call_type</text><text x="140" y="122" fill="#94a3b8" font-size="12">VARCHAR(20)</text>
    <text x="15" y="144" fill="#e2e8f0" font-size="12">    started_at</text><text x="140" y="144" fill="#94a3b8" font-size="12">TIMESTAMPTZ</text>
    <text x="15" y="166" fill="#e2e8f0" font-size="12">    answered_at</text><text x="140" y="166" fill="#94a3b8" font-size="12">TIMESTAMPTZ</text>
    <text x="15" y="188" fill="#e2e8f0" font-size="12">    ended_at</text><text x="140" y="188" fill="#94a3b8" font-size="12">TIMESTAMPTZ</text>
    <text x="15" y="210" fill="#e2e8f0" font-size="12">    status</text><text x="140" y="210" fill="#94a3b8" font-size="12">VARCHAR(20)</text>
  </g>

  <!-- 9. BLOCKED_USERS TABLE -->
  <g transform="translate(50, 770)" filter="url(#shadow)">
    <rect width="180" height="130" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <path d="M 0 0 h 180 v 34 h -180 z" fill="#334155" rx="8"/>
    <text x="12" y="22" fill="#ffffff" font-size="13" font-weight="bold">BLOCKED_USERS</text>
    <text x="140" y="22" fill="#94a3b8" font-size="10">4,000</text>
    <text x="12" y="56" fill="#f59e0b" font-size="12" font-weight="bold">PK,FK blocker_id</text><text x="130" y="56" fill="#94a3b8" font-size="12">BIGINT</text>
    <text x="12" y="78" fill="#f59e0b" font-size="12" font-weight="bold">PK,FK blocked_id</text><text x="130" y="78" fill="#94a3b8" font-size="12">BIGINT</text>
    <text x="12" y="100" fill="#e2e8f0" font-size="12">      blocked_at</text><text x="130" y="100" fill="#94a3b8" font-size="12">TIMESTAMPTZ</text>
  </g>

</svg>

